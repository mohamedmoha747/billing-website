<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Billing</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Restaurant Billing System</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link active">Billing</a>
                <a href="menu-management.html" class="nav-link">Manage Menu</a>
                <a href="sales-report.html" class="nav-link">Sales Report</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="billing-layout">
                <!-- Menu Section -->
                <section class="menu-section">
                    <h2>Menu</h2>
                    <div id="menu-grid" class="menu-grid">
                        <!-- Menu items will be loaded here -->
                    </div>
                </section>

                <!-- Cart Section -->
                <aside class="cart-section">
                    <div class="cart-header">
                        <h2>Cart</h2>
                        <span id="cart-count" class="cart-count">0</span>
                    </div>
                    <div id="cart-items" class="cart-items">
                        <!-- Cart items will be loaded here -->
                    </div>
                    <div class="cart-footer">
                        <div class="cart-total">
                            <strong>Total: <span id="cart-total">₹0.00</span></strong>
                        </div>
                        <div class="cart-actions">
                            <button class="btn btn-secondary" onclick="clearCart()">Clear Cart</button>
                            <button class="btn btn-primary" onclick="printBill()">Print Bill</button>
                            <button class="btn btn-success" onclick="payNow()">Pay Now</button>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
